[package]
edition = "2021"
name = "woodox"
version = "0.1.0"

[dependencies]
woodox-lib = { path = "../library" }

cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = { version = "0.2.5", features = ["unproven"] }
embedded-time = "0.12"

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

usbd-human-interface-device = "0.3"
usb-device = "0"
fugit = "0"
packed_struct = { version = "0", default-features = false }

# but you can use any BSP. Uncomment this to use the pro_micro_rp2040 BSP instead
# sparkfun-pro-micro-rp2040 = "0.3"

rp2040-hal = { version="0.8", features=["rt", "critical-section-impl"] }
rp2040-boot2 = "0.2"

ws2812-pio = "0.6"
smart-leds = "0.3"

critical-section = "*"

[dev-dependencies]
embedded-hal-mock = "0.9"

[features]
default = ["macropad"]

# Timer to gather some benchmarks during runtime
timers = []

macropad = []
